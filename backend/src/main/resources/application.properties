server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/menixjobai}
spring.datasource.username=${DB_USERNAME:menix}
spring.datasource.password=${DB_PASSWORD:menix_local_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
menix.upload-dir=${UPLOAD_DIR:uploads}
menix.gemini.api-key=${GEMINI_API_KEY:}
menix.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
