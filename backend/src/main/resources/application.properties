server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${DB_USERNAME:menix}
spring.datasource.password=${DB_PASSWORD:menix_local_password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
logging.level.com.menix=INFO
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
menix.upload-dir=${UPLOAD_DIR:uploads}
menix.gemini.api-key=${GEMINI_API_KEY:}
menix.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
menix.gemini.diagnostics-token=${GEMINI_DIAGNOSTICS_TOKEN:}
